name: Build LUX Camera IPA (unsigned for sideload)

# LUX Camera (www/camera.html) 専用。camera.htmlの変更でIPAを作る。
# ビルド時に camera.html を index.html として同梱するので
# 起動直後にカメラが開く。既存の www/index.html は壊さない。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "www/camera.html"
      - "capacitor.config.json"
      - "package.json"
      - "ios/**"
      - ".github/workflows/build-lux-ipa.yml"

jobs:
  build-lux-ipa:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Use camera.html as launch page
        run: |
          cp www/camera.html www/__index_backup.html
          cp www/camera.html www/index.html
          ls -lh www/

      - name: Sync web assets to iOS
        run: npx cap sync ios

      - name: Restore index.html
        run: |
          mv www/__index_backup.html www/index.html
          git status --short www/ || true

      - name: Brand as LUX Camera (CI workspace only)
        working-directory: ios/App
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName LUX Camera" App/Info.plist || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string LUX Camera" App/Info.plist
          /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" App/Info.plist

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer || true; xcodebuild -version

      - name: Install CocoaPods deps
        working-directory: ios/App
        run: pod install

      - name: Build unsigned .app
        working-directory: ios/App
        run: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PRODUCT_BUNDLE_IDENTIFIER=com.my.luxcamera

      - name: Package unsigned IPA
        working-directory: ios/App
        run: |
          rm -rf Payload LUXCamera-unsigned.ipa
          mkdir Payload
          cp -r build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r LUXCamera-unsigned.ipa Payload
          ls -lh LUXCamera-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: LUXCamera-unsigned-ipa
          path: ios/App/LUXCamera-unsigned.ipa

      - name: Publish IPA to Release (直リンクDL用)
        uses: ncipollo/release-action@v1
        with:
          tag: lux-unsigned
          name: "LUX Camera iOS unsigned IPA"
          body: "LUX Camera (無音シャッター搭載プロカメラ) の署名なしIPA。Sideloadly / AltStore で無料Apple ID署名して入れてください。7日ごとに再署名が必要です。Bundle ID: com.my.luxcamera"
          allowUpdates: true
          artifacts: "ios/App/LUXCamera-unsigned.ipa"
          token: ${{ secrets.GITHUB_TOKEN }}
